<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="sidepanel.css" />
    <title>Koryta — fakty</title>
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" width="20" height="20" />
      <h1 id="page">Koryta</h1>
      <!-- Chrome draws no chrome of its own around a side panel, so a panel
           can only be dismissed from the toolbar button that opened it. This is
           the cross the reader looks for instead. -->
      <button
        id="close"
        type="button"
        class="icon-button"
        aria-label="Zamknij panel"
        title="Zamknij panel"
      >
        ×
      </button>
    </header>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <a id="progress" href="#" target="_blank" class="progress-link" hidden>
      Śledź postęp na stronie Procesy →
    </a>

    <button id="capture" type="button" class="primary" hidden>
      Zapisz i wyciągnij fakty
    </button>

    <!-- Shown once the reader highlights a passage in the article, which is how
         they say "there is a fact here that the run over the whole page
         missed". -->
    <section id="selection-section" class="selection" hidden>
      <p id="selection-preview" class="selection__preview"></p>
      <button id="selection-extract" type="button" class="secondary">
        Wyciągnij fakty z zaznaczenia
      </button>
    </section>

    <section id="facts-section" hidden>
      <h2 id="facts-heading" class="facts-heading"></h2>
      <div id="facts" class="facts"></div>
      <a id="facts-all" href="#" target="_blank" class="facts-all">
        Otwórz w koryta.pl →
      </a>
    </section>

    <p id="empty" class="empty" hidden></p>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
