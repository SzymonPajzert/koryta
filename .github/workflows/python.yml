name: Python

on:
  pull_request:
    paths:
      - "data/pipelines/src/**"
      # A dependency bump touches neither of these under src/, so without them
      # a Dependabot pull request ran no Python job at all.
      - "data/pipelines/pyproject.toml"
      - "data/pipelines/uv.lock"
      - ".github/workflows/python.yml"

permissions:
  contents: read

# uv reads requires-python from pyproject.toml and fetches the interpreter
# itself, so there is no setup-python step. `--locked` installs exactly what
# uv.lock pins and fails if the lock has drifted from pyproject.toml, rather
# than quietly re-resolving; `--no-sync` on the run steps stops them
# re-resolving too.
env:
  UV_VERSION: "0.11.33"

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "data/pipelines/uv.lock"

      - name: Install dependencies
        working-directory: data/pipelines
        run: uv sync --locked --group dev

      - name: Run ruff - static analysis
        working-directory: data/pipelines
        run: uv run --no-sync ruff check

  lint-imports:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "data/pipelines/uv.lock"

      - name: Install dependencies
        working-directory: data/pipelines
        run: uv sync --locked --group dev

      - name: Run import linter
        working-directory: data/pipelines
        run: uv run --no-sync lint-imports

  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "data/pipelines/uv.lock"

      # The ml group (torch, spacy and the nvidia runtimes -- 4.5 GB) is left
      # out: no test needs it. dev comes along as uv's default group.
      #
      # service is needed even though nothing here is a service test: pytest
      # imports every test module to collect it, and src/service/test_app.py
      # imports the app, which imports fastapi. Without it collection fails and
      # the whole run exits 2 before a single test executes.
      - name: Install dependencies
        working-directory: data/pipelines
        run: uv sync --locked --group test --group service

      - name: Run pytest
        working-directory: data/pipelines
        # TODO https://github.com/SzymonPajzert/koryta/issues/196
        run: uv run --no-sync pytest --ignore src/tests

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "data/pipelines/uv.lock"

      # service for the same reason as the pytest job: mypy reads src/service,
      # and an unresolvable fastapi import is an error like any other.
      - name: Install dependencies
        working-directory: data/pipelines
        run: uv sync --locked --group test --group service

      - name: Run mypy
        working-directory: data/pipelines
        run: uv run --no-sync mypy src
