name: Firestore Rules

# firestore.rules sits at the repo root, so the frontend/** filters on the
# other workflows never see it change - a rules edit could reach prod without
# a single check running. This workflow watches the file itself.

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "frontend/tests/rules/**"
  pull_request:
    paths:
      - "firestore.rules"
      - "frontend/tests/rules/**"

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Java (for Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Run rules tests
        working-directory: frontend
        run: npm run test:rules
