name: Vitest

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      # What the declarations job uploads, which the site's tests parse and
      # store; test_bip_declarations_ci.py in the job's tests lists why.
      - "data/pipelines/src/jobs/bip_declarations/tests/employment_upload.json"
  pull_request:
    paths:
      - "frontend/**"
      - "data/pipelines/src/jobs/bip_declarations/tests/employment_upload.json"

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Tests
        working-directory: frontend
        run: npx vitest run

  eslint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run Tests
        working-directory: frontend
        run: npx eslint .
