name: Pipelines

# Two tiers over the same code.
#
# A pull request touching the scrapers gets the `slice` tier: one multistream
# shard of the Wikipedia dump, ~230 MB and a few minutes, no credentials. Most
# pipeline breakage is structural and shows up on a shard exactly as it would
# on the whole dump.
#
# The nightly gets the `full` tier: the whole 2.9 GB dump, every pipeline, from
# scratch. That one needs GCP, so it cannot run on a fork's pull request --
# fork PRs get no OIDC token and no secrets.
#
# Both pin a dated dump rather than `latest`, which rotates roughly twice a
# month. On `latest` a red build cannot distinguish "the pipeline broke" from
# "Wikipedia changed", and the download cache key is never stable.

on:
  schedule:
    # 03:00 UTC, so it is done before the morning in Warsaw.
    - cron: "0 3 * * *"
  pull_request:
    paths:
      - "data/scrapers/**"
      - ".github/workflows/pipelines.yml"
  workflow_dispatch:
    inputs:
      tier:
        description: "full (whole dump, all pipelines) or slice (one shard, wiki only)"
        type: choice
        options: [full, slice]
        default: full
      dump_date:
        description: "Wikipedia dump to pin, YYYYMMDD. Empty uses the default below."
        type: string
        default: ""

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"
  # Bump deliberately. A newer dump means new row counts, so expect to refresh
  # src/tests/e2e/baseline.json in the same commit. Wikimedia keeps only a
  # handful of dated runs, so this ages out and the resolve step says so.
  DEFAULT_DUMP_DATE: "20260701"

jobs:
  # Resolving the shard URL needs the dump directory listing: the shards' page
  # id ranges (…multistream1.xml-p1p187037.bz2) are not derivable from the date.
  resolve-dump:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.pick.outputs.tier }}
      url: ${{ steps.pick.outputs.url }}
      filename: ${{ steps.pick.outputs.filename }}
    steps:
      - name: Pick the dump to process
        id: pick
        env:
          TIER: ${{ github.event_name == 'pull_request' && 'slice' || inputs.tier || 'full' }}
          DUMP_DATE: ${{ inputs.dump_date || '' }}
        run: |
          set -euo pipefail
          date="${DUMP_DATE:-$DEFAULT_DUMP_DATE}"
          base="https://dumps.wikimedia.org/plwiki/${date}"

          if [ "$TIER" = "full" ]; then
            url="${base}/plwiki-${date}-pages-articles-multistream.xml.bz2"
          else
            # First shard only. Its page-id range is in the filename and is not
            # derivable from the date, so it has to be read off the listing.
            # No `head` in the pipeline: under pipefail it closes grep's output
            # early and the whole thing exits 141.
            shards=$(curl -sfL "${base}/" \
              | grep -oE "plwiki-${date}-pages-articles-multistream1\.xml-p[0-9]+p[0-9]+\.bz2" \
              | sort -u) || shards=""
            shard=${shards%%$'\n'*}
            if [ -z "$shard" ]; then
              echo "::error::No multistream shard 1 at ${base}/ - has dump ${date} been pruned?"
              exit 1
            fi
            url="${base}/${shard}"
          fi

          if ! curl -sfIL "$url" >/dev/null; then
            echo "::error::${url} is not fetchable - has dump ${date} been pruned? Bump DEFAULT_DUMP_DATE."
            exit 1
          fi

          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "filename=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "Tier $TIER, dump $url"

  run:
    needs: resolve-dump
    runs-on: ubuntu-latest
    # The full tier is ~30-40 min of processing; the ceiling is here to catch a
    # hang, not to bound normal work.
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write # for Workload Identity Federation
    env:
      TIER: ${{ needs.resolve-dump.outputs.tier }}
      DUMP_URL: ${{ needs.resolve-dump.outputs.url }}
      DUMP_FILE: ${{ needs.resolve-dump.outputs.filename }}
      # Never write to the shared bucket from CI.
      DISABLE_BACKUP: "1"
      # A same-repo pull request can mint an OIDC token; a fork's cannot.
      HAVE_GCP: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "data/scrapers/uv.lock"

      # Keyed on the exact dump file, so a pinned dump is fetched from
      # wikimedia once and restored from cache every night after. Repo-wide
      # cache is 10 GB and evicts least-recently-used, which the uv cache also
      # draws on -- another reason the ml group stays out of this job.
      - name: Cache the dump
        uses: actions/cache@v6
        with:
          path: data/scrapers/downloaded/${{ env.DUMP_FILE }}
          key: wikidump-${{ env.DUMP_FILE }}

      # Everything else PeoplePKW and Teryt pull off pkw.gov.pl and
      # stat.gov.pl. Separate from the dump because this one turns over: the
      # rolling key always saves, and restore-keys takes the newest previous.
      - name: Cache the other downloads
        uses: actions/cache@v6
        with:
          path: |
            data/scrapers/downloaded
            !data/scrapers/downloaded/*.bz2
          key: downloads-${{ env.TIER }}-${{ github.run_id }}
          restore-keys: downloads-${{ env.TIER }}-

      # The ml group (torch, spacy, the nvidia runtimes -- 4.5 GB) is left out:
      # no pipeline this job runs needs it.
      - name: Install dependencies
        working-directory: data/scrapers
        run: uv sync --group test

      # Sets up ADC, which google.auth.default() picks up. No key file. Read
      # access to gs://koryta-pl-crawled is all any of this needs -- what looks
      # like Firestore in scrapers.koryta.download is a leveldb export sitting
      # in that bucket, not the live database.
      - name: Authenticate to Google Cloud
        if: env.HAVE_GCP == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PIPELINES_SERVICE_ACCOUNT }}

      # --refresh all reprocesses everything rather than reading versioned
      # output, which is the point: a fresh checkout has none anyway, and
      # reading backups would hide a pipeline that no longer produces its own.
      #
      # --write-backup :all rather than --no-backup: this run must not publish
      # to the shared bucket, but it does have to read from it. --no-backup
      # shut off both directions, which left a pipeline whose input only lives
      # in the shared cache with nothing to start from.
      #
      # --assume-yes answers the "this pipeline runs long" prompts. Without it
      # they read EOF from /dev/null, take it as no, and skip the wiki pass.
      - name: Run pipelines
        working-directory: data/scrapers
        run: |
          set -euo pipefail
          # ProcessWikiNer and its ProcessWikiPeopleNames dependency each make
          # their own full pass over the dump, which would roughly triple the
          # run for a dataset nothing serves yet. Excluding the top-level one
          # takes the dependency with it.
          if [ "$TIER" = "full" ]; then
            selection="--all-pipelines --exclude ProcessWikiNer"
          else
            # Wiki only: the rest reads GCS or Firestore, which a fork PR has
            # no credentials for. ProcessWiki needs none.
            selection="ProcessWiki"
          fi
          # shellcheck disable=SC2086
          uv run --no-sync koryta $selection \
            --refresh all \
            --write-backup :all \
            --assume-yes \
            --wiki-dump-url "$DUMP_URL" \
            --wiki-dump-file "$DUMP_FILE"

      # src/tests/pipelines runs real pipelines through read_or_process, which
      # is why the unit-test job ignores src/tests entirely (issue #196). Here
      # the pipeline step has already written versioned/, so on the full tier
      # they read that rather than reprocessing.
      - name: Run pipeline tests
        working-directory: data/scrapers
        run: |
          set -euo pipefail
          if [ "$TIER" = "full" ]; then
            # All but the RejestrIO scraper: a miss on both the versioned
            # output and the shared cache leaves that test running the scraper
            # itself, which bills per query. Not worth the risk for one test.
            uv run --no-sync pytest src/tests/pipelines -v \
              --ignore=src/tests/pipelines/test_scrape_rejestr_io.py
          else
            # Only PeoplePKW here, and the constraint is runtime rather than
            # access: on this tier the pipeline step ran ProcessWiki alone, so
            # any other module would execute its whole graph from scratch --
            # a full run wearing a pull request's clothes. PKW is the cheapest
            # of them and its chain (PeoplePKW -> Teryt) needs no credentials
            # at all, so it also covers the fork case.
            #
            # To widen this, add modules here; with HAVE_GCP true they will
            # have bucket access, they will just be slow.
            uv run --no-sync pytest src/tests/pipelines/test_person_pkw.py -v
          fi

      - name: Check the output
        working-directory: data/scrapers
        env:
          KORYTA_E2E_TIER: ${{ env.TIER }}
          # A missing output is a failure here, not a skip as it is locally.
          KORYTA_E2E_STRICT: "1"
        run: uv run --no-sync pytest -m e2e src/tests/e2e -v

      # src/tests/pipelines carries the other kind of e2e test: the database
      # invariants, which read the newest Firestore export out of the bucket
      # rather than versioned/. Deliberately not folded into the step above.
      #
      # Only on the full tier, for two reasons. It needs the bucket, and a fork
      # pull request has no credentials to read it with. And what it checks is
      # production data rather than the code in the diff, so a red here would
      # be telling a contributor about drift they did not cause -- nightly is
      # the right place to hear it.
      #
      # Runs even if the step above failed: versioned/ output and stored data
      # break independently, and one night should report both.
      - name: Check the database invariants
        if: ${{ !cancelled() && env.TIER == 'full' }}
        working-directory: data/scrapers
        run: uv run --no-sync pytest -m e2e src/tests/pipelines -v

      - name: Upload pipeline output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: versioned-${{ env.TIER }}
          # Not the dump, which lives in downloaded/.
          path: data/scrapers/versioned
          retention-days: 14
