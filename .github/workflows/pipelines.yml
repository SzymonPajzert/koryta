name: Pipelines

# Two tiers over the same code.
#
# A pull request touching the pipelines gets the `slice` tier: one multistream
# shard of the Wikipedia dump, ~230 MB and a few minutes, no credentials. Most
# pipeline breakage is structural and shows up on a shard exactly as it would
# on the whole dump.
#
# The `full` tier is the whole 2.9 GB dump, every pipeline, from scratch, and
# runs only when dispatched by hand. That one needs GCP, so it cannot run on a
# fork's pull request -- fork PRs get no OIDC token and no secrets.
#
# Until 2026-10-14 the full tier ran nightly at 03:00 UTC. It had not finished
# since at least 09-24, and its public runner was the reason the production
# data needed guarding at all: anybody can read a run's log. The night is the
# koryta-nightly VM's now (data/nightly). It reprocesses every pipeline but a
# few held ones with --refresh all, then runs the pipeline tests, the output
# checks and the invariants, with the PESEL key and the bucket grants this
# runner lacks, and its logs stay private. A dispatched full tier still stops
# at the first private read it has no grant for (gs://koryta-pl-compressed at
# CompaniesKRS), and whatever it prints is public.
#
# Both pin a dated dump rather than `latest`, which rotates roughly twice a
# month. On `latest` a red build cannot distinguish "the pipeline broke" from
# "Wikipedia changed", and the download cache key is never stable.

on:
  pull_request:
    paths:
      - "data/pipelines/**"
      - ".github/workflows/pipelines.yml"
  workflow_dispatch:
    inputs:
      tier:
        description: "slice (one shard, wiki only) or full (whole dump, all pipelines, a public log of private data)"
        type: choice
        options: [slice, full]
        default: slice
      dump_date:
        description: "Wikipedia dump to pin, YYYYMMDD. Empty uses the default below."
        type: string
        default: ""

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"
  # Bump deliberately. A newer dump means new row counts, so expect to refresh
  # src/tests/e2e/baseline.json in the same commit. Wikimedia keeps only a
  # handful of dated runs, so this ages out and the resolve step says so.
  DEFAULT_DUMP_DATE: "20260701"

jobs:
  # Resolving the shard URL needs the dump directory listing: the shards' page
  # id ranges (…multistream1.xml-p1p187037.bz2) are not derivable from the date.
  resolve-dump:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.pick.outputs.tier }}
      url: ${{ steps.pick.outputs.url }}
      filename: ${{ steps.pick.outputs.filename }}
    steps:
      - name: Pick the dump to process
        id: pick
        env:
          TIER: ${{ github.event_name == 'pull_request' && 'slice' || inputs.tier || 'slice' }}
          DUMP_DATE: ${{ inputs.dump_date || '' }}
        run: |
          set -euo pipefail
          date="${DUMP_DATE:-$DEFAULT_DUMP_DATE}"
          base="https://dumps.wikimedia.org/plwiki/${date}"

          if [ "$TIER" = "full" ]; then
            url="${base}/plwiki-${date}-pages-articles-multistream.xml.bz2"
          else
            # First shard only. Its page-id range is in the filename and is not
            # derivable from the date, so it has to be read off the listing.
            # No `head` in the pipeline: under pipefail it closes grep's output
            # early and the whole thing exits 141.
            shards=$(curl -sfL "${base}/" \
              | grep -oE "plwiki-${date}-pages-articles-multistream1\.xml-p[0-9]+p[0-9]+\.bz2" \
              | sort -u) || shards=""
            shard=${shards%%$'\n'*}
            if [ -z "$shard" ]; then
              echo "::error::No multistream shard 1 at ${base}/ - has dump ${date} been pruned?"
              exit 1
            fi
            url="${base}/${shard}"
          fi

          if ! curl -sfIL "$url" >/dev/null; then
            echo "::error::${url} is not fetchable - has dump ${date} been pruned? Bump DEFAULT_DUMP_DATE."
            exit 1
          fi

          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "filename=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "Tier $TIER, dump $url"

  run:
    needs: resolve-dump
    runs-on: ubuntu-latest
    # The full tier is ~30-40 min of processing; the ceiling is here to catch a
    # hang, not to bound normal work.
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write # for Workload Identity Federation
    env:
      TIER: ${{ needs.resolve-dump.outputs.tier }}
      DUMP_URL: ${{ needs.resolve-dump.outputs.url }}
      DUMP_FILE: ${{ needs.resolve-dump.outputs.filename }}
      # Never write to the shared bucket from CI.
      DISABLE_BACKUP: "1"
      # A same-repo pull request can mint an OIDC token; a fork's cannot.
      HAVE_GCP: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "data/pipelines/uv.lock"

      # Keyed on the exact dump file, so a pinned dump is fetched from
      # wikimedia once and restored from cache every run after. Repo-wide
      # cache is 10 GB and evicts least-recently-used, which the uv cache also
      # draws on -- another reason the ml group stays out of this job.
      # restore/save rather than `actions/cache`, whose post step declares
      # `post-if: success()` -- it saves nothing from a job that failed. The
      # full tier had never once succeeded, so between 2026-07-31 and
      # 2026-09-01 it re-fetched the 2.9 GB dump every night and cached it
      # never; `gh api repos/:owner/:repo/actions/caches` showed slice entries
      # and no full ones at all. Downloading is not what breaks, so what was
      # downloaded should outlive the run that broke.
      - name: Cache the dump
        id: dump-cache
        uses: actions/cache/restore@v6
        with:
          path: data/pipelines/downloaded/${{ env.DUMP_FILE }}
          key: wikidump-${{ env.DUMP_FILE }}

      # Everything else PeoplePKW and Teryt pull off pkw.gov.pl and
      # stat.gov.pl. Separate from the dump because this one turns over: the
      # rolling key always saves, and restore-keys takes the newest previous.
      #
      # Only what the open web serves, by the file types it comes in. The
      # rest of downloaded/ is the run's copies of the private buckets - the
      # koryta.pl export with every page, note and revision, the rejestr.io
      # and KRS feeds - and any pull request's run, a fork's too, can restore
      # a cache main saved. So those are fetched afresh with the run's own
      # credentials (the export alone is ~170 MB). They are the `hostname=`
      # and `bucket=` names of stores.storage, compressed/, .memo/ and the CRU
      # dump, which none of these patterns reach; the two exclusions are for
      # a copy whose name happens to end like the open web's. .listing-ranges/
      # holds where big bucket prefixes split for listing, object names only.
      #
      # Files, never downloaded/ itself: actions/cache hands tar the paths
      # the patterns match, and tar takes a directory whole, so an exclusion
      # under one does nothing. Until 2026-10-14 the path was downloaded/
      # with !*.bz2, which kept out nothing at all.
      #
      # Restore and save must list the same patterns in the same order - the
      # cache's version is a hash of them - and test_ci_workflows.py holds
      # them to that.
      - name: Cache the other downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            data/pipelines/downloaded/*.csv
            data/pipelines/downloaded/*.txt
            data/pipelines/downloaded/*.xls
            data/pipelines/downloaded/*.xlsx
            data/pipelines/downloaded/*.zip
            data/pipelines/downloaded/.listing-ranges
            !data/pipelines/downloaded/hostname=*
            !data/pipelines/downloaded/bucket=*
          key: open-downloads-${{ env.TIER }}-${{ github.run_id }}
          restore-keys: open-downloads-${{ env.TIER }}-

      # The ml group (torch, spacy, the nvidia runtimes -- 4.5 GB) is left out:
      # no pipeline this job runs needs it.
      - name: Install dependencies
        working-directory: data/pipelines
        run: uv sync --group test

      # Sets up ADC, which google.auth.default() picks up. No key file. Read
      # access to gs://koryta-pl-crawled is all any of this needs -- what looks
      # like Firestore in scrapers.koryta.download is a leveldb export sitting
      # in that bucket, not the live database.
      - name: Authenticate to Google Cloud
        if: env.HAVE_GCP == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PIPELINES_SERVICE_ACCOUNT }}

      # --refresh all reprocesses everything rather than reading versioned
      # output, which is the point: a fresh checkout has none anyway, and
      # reading backups would hide a pipeline that no longer produces its own.
      #
      # --assume-yes answers the "this pipeline runs long" prompts. Without it
      # they read EOF from /dev/null, take it as no, and skip the wiki pass.
      #
      # The step has its own ceiling, below the job's, so that a slow run
      # fails here rather than being cancelled: the saves below are
      # `!cancelled()`, and every nightly from 2026-09-24 to 09-27 was
      # cancelled at the job's 120 minutes and kept nothing it had fetched.
      # Failed instead, it leaves downloaded/ to the next run, which starts
      # where this one stopped.
      - name: Run pipelines
        timeout-minutes: 100
        working-directory: data/pipelines
        run: |
          set -euo pipefail
          # ProcessWikiNer and its ProcessWikiPeopleNames dependency each make
          # their own full pass over the dump, which would roughly triple the
          # run for a dataset nothing serves yet. Excluding the top-level one
          # takes the dependency with it.
          #
          # The article branch comes out for a different reason: ArticleDoneUrls
          # reads the production crawl-queue Postgres and the url_store service,
          # and a GitHub runner has neither, so it raises
          # psycopg_pool.PoolTimeout five seconds in. Naming it alone would not
          # help -- select_pipelines only subtracts from the top-level list, and
          # read_or_process runs a stale source anyway -- so the eight pipelines
          # that reach it through their annotations come out with it. Standing
          # up an empty `services: postgres:` here would be worse than the
          # failure: it answers with zero done URLs, and all eight go green
          # having processed nothing.
          #
          # This leaves 40 of the 51 pipelines running, and drops the only
          # ContextResource the nightly was asking for -- the article branch is
          # what pulled in an LLM client. To put the branch back, give the
          # runner a reachable crawl queue rather than deleting lines here.
          if [ "$TIER" = "full" ]; then
            excluded=(
              ProcessWikiNer
              ArticleDoneUrls
              ArticleParsed
              ArticleDomainSelectors
              ArticleAnalyzed
              ArticlePersonMentions
              ArticleExtractedFacts
              ArticleFactsVerified
              ArticleKoryciarskiScores
              PeopleAffairTags
              # The BIP documents read the BIP crawl's queue, a Postgres of
              # its own the runner has neither: the same PoolTimeout. Both
              # are named, as BipDocumentsParsed reads BipUrlsClassified and
              # each is on the top-level list.
              BipUrlsClassified
              BipDocumentsParsed
              # Both read every stored odpis, one object at a time -- ~8,300
              # PDFs, the better part of an hour on a cold runner -- and the
              # seats need the PESEL key, which the runner does not hold.
              # Excluding them only takes them off the top-level list, and
              # PeopleKRSCombined still builds the seats. It does so inside
              # its process rather than before it (preprocess_sources), so
              # the missing key fails them before any document is read, the
              # pipeline says so and takes rejestr.io's people alone, and the
              # entries are never read. Until 2026-10-10 the seats were built
              # before process, and the missing key failed the whole run.
              KrsOdpisEntries
              KrsOdpisSeats
              # Writes nothing - it prints how koryta.pl exports differ - and
              # reads every export ever taken: 65 minutes and over 16 GB for
              # the people alone on the nightly VM (data/nightly).
              KorytaDiffer
              # Reads every export since August, one more each day, to answer
              # a question asked by hand; nothing reads what it writes.
              PeopleScoreCoverage
              # The article branch's domain->region map, copied from a
              # gitignored files/domain_to_region.json no runner has. Only
              # ArticlePersonMentions, out with the branch above, reads it.
              # Until koryta decided every selected pipeline's tree it was
              # never really run here; now it would fail the job.
              DomainToRegion
            )
            selection="--all-pipelines"
            for pipeline in "${excluded[@]}"; do
              selection="$selection --exclude $pipeline"
            done
          else
            # Wiki only: the rest reads GCS or Firestore, which a fork PR has
            # no credentials for. ProcessWiki needs none.
            selection="ProcessWiki"
          fi
          # shellcheck disable=SC2086
          uv run --no-sync koryta $selection \
            --refresh all \
            --no-backup \
            --assume-yes \
            --wiki-dump-url "$DUMP_URL" \
            --wiki-dump-file "$DUMP_FILE"

      # Both saves sit here rather than in a post step so that a failed run
      # still keeps its downloads. `!cancelled()` and not `always()`: a
      # cancelled job can be holding a half-written file.
      #
      # The dump is skipped on a restore hit -- the key is the filename, so the
      # content cannot have changed, and saving an existing key is an error.
      - name: Save the dump
        if: ${{ !cancelled() && steps.dump-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: data/pipelines/downloaded/${{ env.DUMP_FILE }}
          key: wikidump-${{ env.DUMP_FILE }}

      # No such guard here: the key carries the run id, so it is new every
      # time and there is nothing to collide with.
      - name: Save the other downloads
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: |
            data/pipelines/downloaded/*.csv
            data/pipelines/downloaded/*.txt
            data/pipelines/downloaded/*.xls
            data/pipelines/downloaded/*.xlsx
            data/pipelines/downloaded/*.zip
            data/pipelines/downloaded/.listing-ranges
            !data/pipelines/downloaded/hostname=*
            !data/pipelines/downloaded/bucket=*
          key: open-downloads-${{ env.TIER }}-${{ github.run_id }}

      # src/tests/pipelines runs real pipelines through read_or_process, which
      # is why the unit-test job ignores src/tests entirely (issue #196). Here
      # the pipeline step has already written versioned/, so on the full tier
      # they read that rather than reprocessing.
      - name: Run pipeline tests
        working-directory: data/pipelines
        run: |
          set -euo pipefail
          if [ "$TIER" = "full" ]; then
            # All but the RejestrIO scraper: with no versioned output and
            # backups disabled, that test would not read a cached result -- it
            # would run the scraper, which bills per query.
            uv run --no-sync pytest src/tests/pipelines -v \
              --ignore=src/tests/pipelines/test_scrape_rejestr_io.py
          else
            # Only PeoplePKW here, and the constraint is runtime rather than
            # access: on this tier the pipeline step ran ProcessWiki alone, so
            # any other module would execute its whole graph from scratch --
            # a full run wearing a pull request's clothes. PKW is the cheapest
            # of them and its chain (PeoplePKW -> Teryt) needs no credentials
            # at all, so it also covers the fork case.
            #
            # To widen this, add modules here; with HAVE_GCP true they will
            # have bucket access, they will just be slow.
            uv run --no-sync pytest src/tests/pipelines/test_person_pkw.py -v
          fi

      - name: Check the output
        working-directory: data/pipelines
        env:
          KORYTA_E2E_TIER: ${{ env.TIER }}
          # A missing output is a failure here, not a skip as it is locally.
          KORYTA_E2E_STRICT: "1"
        run: uv run --no-sync pytest -m e2e src/tests/e2e -v

      # src/tests/pipelines carries the other kind of e2e test: the database
      # invariants, which read the newest Firestore export out of the bucket
      # rather than versioned/. Deliberately not folded into the step above.
      #
      # Only on the full tier, for two reasons. It needs the bucket, and a fork
      # pull request has no credentials to read it with. And what it checks is
      # production data rather than the code in the diff, so a red here would
      # be telling a contributor about drift they did not cause. The VM's night
      # runs the same tests every night (the `invariants` step of
      # koryta_nightly), which is where to hear it.
      #
      # Runs even if the step above failed: versioned/ output and stored data
      # break independently, and one run should report both.
      #
      # The ceiling is a backstop, not a budget: the 60 tests that remain read
      # one Firestore export between them and finished in seven minutes the
      # first night they ran at all. A step that wants half an hour has found
      # something new to download, and should say so rather than eat the job.
      - name: Check the database invariants
        if: ${{ !cancelled() && env.TIER == 'full' }}
        timeout-minutes: 30
        working-directory: data/pipelines
        run: |
          set -euo pipefail
          # test_rejestrio_coverage.py is the one file here that does not read
          # the export. Both its module fixtures walk the whole
          # `hostname=rejestr.io` prefix of gs://koryta-pl-crawled -- once for
          # RejestrIOCoverage, again for PersonFeedCoverage -- and that bucket
          # is multi-region, so the egress is billed per GB. On 2026-09-01,
          # the first night this step ever got past authentication, its 11
          # tests took the 100 minutes between the other 60 finishing and the
          # job's 120-minute ceiling, then died without a verdict; the
          # cancellation took the caches and the artifact upload with it.
          #
          # It is an audit rather than a nightly signal anyway -- the budgets
          # it asserts are measured by hand and dated in the file. Run it
          # deliberately:
          #
          #   .venv/bin/pytest -m e2e src/tests/pipelines/test_rejestrio_coverage.py
          uv run --no-sync pytest -m e2e src/tests/pipelines -v \
            --ignore=src/tests/pipelines/test_rejestrio_coverage.py

      # No artifact. The repo is public, so anybody with a GitHub account can
      # download what a run uploads, and versioned/ is the people: register
      # and PKW entries with their birth dates, the merged people, the site's
      # pages unpublished ones included. Until 2026-10-14 all of it went up as
      # versioned-<tier> for 14 days, and nothing ever downloaded it. A red
      # run's output is for the nightly VM or a local run, where versioned/
      # stays on a private disk.
