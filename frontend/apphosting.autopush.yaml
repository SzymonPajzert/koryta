# Overrides for the `autopush` backend, merged over apphosting.yaml at build
# time with this file winning. App Hosting picks it by the backend's
# *environment name*, not by its id, so it does nothing until that name is set
# to `autopush` (console: App Hosting > autopush > Settings > Environment).
# prod keeps the base file's 1 GiB for as long as its own name is not this one.
#
# More memory because POST /api/stats/computeNodes holds the whole database in
# memory: 942 MB peak RSS against the 2026-09-23 export, and it dies on a
# 480 MB heap. node sizes its heap to half the instance's memory and stops at
# ~2 GB: 524 MB under 1 GiB, 2048 MB under this.
#
# 4000 rather than 4096 because App Hosting's build rejects memoryMiB >= 4096
# unless cpu is at least 2 ("A minimum of 2 CPUs is required for memory 4096
# MiB, but CPU is not set"), though Cloud Run gives one CPU up to 4 GiB. It
# validates each file on its own before merging them, so the cpu would have to
# be set here, and autopush would pay for two CPUs to gain 96 MiB.
runConfig:
  memoryMiB: 4000
