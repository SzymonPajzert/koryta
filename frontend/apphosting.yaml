# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 10
  # concurrency: 80
  # cpu: 1
  memoryMiB: 1024

# Environment variables and secrets.
# See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
#
# Everything below is BUILD as well as RUNTIME, and the BUILD half is the one
# that matters: nuxt.config.ts reads these through `process.env` while it is
# building, and at runtime nitro only overrides runtimeConfig from `NUXT_`-
# prefixed names. A RUNTIME-only entry here would be read by nobody, and every
# capture would go on reporting "extractor not configured" with the variable
# plainly set in the console.
#
# Shared by both backends on purpose. `prod` serves koryta.pl, which is the
# extension's default origin; `autopush` gets the same wiring so the flow can be
# exercised there. Note the extractor's own KORYTA_API_URL is https://koryta.pl,
# so facts from either backend's captures are submitted to production.
#
# Both read this file, but only `autopush` is named in firebase.json, and that
# asymmetry is deliberate rather than an oversight. That block is what the
# firebase CLI deploys, `alwaysDeployFromSource` and all — listing `prod` there
# would make a bare `firebase deploy` push whatever is in the working copy
# straight to koryta.pl, with no branch and no review in between. Leaving it out
# means the CLI can only reach staging and prod is released by the build the
# GitHub connection triggers. firebase.json takes an array if that ever needs to
# change (`Array.isArray` in firebase-tools' deploy/apphosting/prepare.ts); it is
# strict JSON, so this note cannot live there.
env:
  # Cloud Tasks rather than a direct call: the extraction is tens of seconds and
  # Cloud Run throttles the cpu once a response is written. "direct" is for a
  # laptop, where there is no metadata server to mint a token with.
  - variable: EXTRACTOR_DISPATCH
    value: tasks
    availability:
      - BUILD
      - RUNTIME

  - variable: EXTRACTOR_URL
    value: https://capture-extractor-735903577811.europe-central2.run.app
    availability:
      - BUILD
      - RUNTIME

  # The account Cloud Tasks mints the request's OIDC token as, and so the one
  # holding run.invoker on the service above — not the account this backend runs
  # as, which only needs serviceAccountUser on it.
  - variable: EXTRACTOR_SERVICE_ACCOUNT
    value: capture-extractor@koryta-pl.iam.gserviceaccount.com
    availability:
      - BUILD
      - RUNTIME

  # These two restate what nuxt.config.ts already defaults to. Spelled out anyway
  # so the deployed wiring reads in one place: the queue is a thing that exists
  # in gcloud, and someone moving it should not have to know that the only
  # record of its name is a fallback in a build config.
  - variable: EXTRACTOR_LOCATION
    value: europe-central2
    availability:
      - BUILD
      - RUNTIME

  - variable: EXTRACTOR_QUEUE
    value: article-extraction
    availability:
      - BUILD
      - RUNTIME

  # What tells sentry.server.config.ts that it is running on a deployed backend
  # rather than on somebody's laptop. There is no request to read a hostname off
  # at init time, and nothing else in the environment separates a deployed nitro
  # from `nuxt preview` — `dev:build` runs preview outside the cross-env that
  # sets USE_EMULATORS, so it looks like production to NODE_ENV too. Set here
  # for both backends; a new one that omits it simply does not report.
  - variable: SENTRY_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  # Who /rozszerzenie hands a Firebase id token to. Pinned by the `key` field in
  # extension/manifest.json rather than assigned by Chrome from the unpacked
  # folder's path, so it is the same id on every machine and can be written down
  # here at all. Without it the page falls back to postMessage and waits on a
  # content script that only runs on localhost, which reads as "Nie znaleziono
  # rozszerzenia" on any deployed origin.
  - variable: NUXT_PUBLIC_EXTENSION_ID
    value: ppgedfpjafcklogippkoheikkalkehbb
    availability:
      - BUILD
      - RUNTIME

  # A Secret Manager reference rather than a value. See
  # https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  #
  # What signs the generated social-card URLs, and the reason it is pinned
  # rather than left out.
  #
  # nuxt-og-image signs every `/_og/` URL and rejects an unsigned one with a
  # 403. With neither `ogImage.security.secret` nor this variable set, it
  # *invents* a secret at module setup - `randomBytes(32)` - so the key changes
  # on every build. That is not a missing lock; it is a lock rekeyed on each
  # deploy, and the signature is part of the URL. Every card anybody had already
  # shared would 403 the next time a platform re-scraped it, and Facebook and
  # LinkedIn cache a failed scrape for days.
  #
  # So this has to exist from the same commit that starts emitting `/_og/` URLs.
  # Setting it now is free; setting it later is the rotation.
  #
  # Needs BUILD as well as RUNTIME: the value is read while nuxt builds, and at
  # runtime nitro only overrides runtimeConfig from `NUXT_`-prefixed names.
  #
  # Create it once with:
  #   firebase apphosting:secrets:set nuxt-og-image-secret --project koryta-pl
  #   firebase apphosting:secrets:grantaccess nuxt-og-image-secret \
  #     --project koryta-pl --backend prod
  # (and again with `--backend autopush`; both backends read this file). Any
  # long random string will do - `openssl rand -base64 32`. It guards render
  # abuse, not user data, but it is still a signing key, so it lives in Secret
  # Manager rather than in git.
  - variable: NUXT_OG_IMAGE_SECRET
    secret: nuxt-og-image-secret
    availability:
      - BUILD
      - RUNTIME
